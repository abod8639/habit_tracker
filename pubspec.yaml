name: habit_tracker
description: "A new Flutter project."

# publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter_dotenv: ^6.0.0

  catppuccin_flutter: ^1.0.0
  cupertino_icons: ^1.0.8
  fl_chart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_heatmap_calendar: ^1.0.5
  flutter_localizations:
    sdk: flutter
  flutter_slidable: ^4.0.0
  get: ^4.7.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  icons_launcher: ^3.0.1
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_local_notifications_linux: ^8.0.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.1.3
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.1.1
  google_generative_ai: ^0.4.6
  image_picker: ^1.1.2
  equatable: ^2.0.8
  dartz: ^0.10.1
  path_provider: ^2.1.5
  flutter_timezone: ^5.0.2
  firebase_analytics: ^12.4.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.8
flutter:
  # uses-asset-bundle-paths: true
  assets:
    - assets/
    - assets/icon/
    - .env

  uses-material-design: true


icons_launcher:
  image_path: "assets/icon/icon for habit_tracker app.png"
  platforms:
    ios:
      enable: true
    android:
      enable: true
    linux:
      enable: true
      image_path: "assets/icon/icon for habit_tracker app.png"
flutter_intl:
  enabled: true
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated
